[tool.poetry]
name = "finance-tracker"
version = "0.1.0"
description = "Personal finance tracker — expenses, investments, net worth"
authors = ["Dhara"]
readme = "README.md"
packages = [{ include = "finance_tracker" }]

[tool.poetry.dependencies]
python = "^3.13"
sqlalchemy = "^2.0"
alembic = "^1.13"
pydantic = "^2.0"
pydantic-settings = "^2.0"
streamlit = "^1.35"
pandas = "^2.0"
plotly = "^5.0"
pdfplumber = "^0.11"
requests = "^2.31"
python-dotenv = "^1.0"
fastapi = "^0.136.3"
uvicorn = "^0.48.0"
python-multipart = "^0.0.30"
httpx = "^0.28.1"
scipy = "^1.17.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.10"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=finance_tracker --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
